name: Build iOS IPA

on:
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công bất kỳ lúc nào

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Lấy các gói phụ thuộc (Dependencies)
        run: flutter pub get

      - name: Build ứng dụng iOS (Không cần chứng chỉ ký)
        run: |
          flutter build ios --release --no-codesign

      - name: Đóng gói thành file .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-release.ipa Payload/

      - name: Tải file .ipa lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-ios-app
          path: app-release.ipa
